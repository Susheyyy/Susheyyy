<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Sushmita Das, Computer Engineering at SIES GST">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="12" fill="#0D1117" stroke="#30363D"/>
  <rect width="900" height="280" rx="12" fill="url(#grid)"/>

  <rect x="-60" y="0" width="60" height="280" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="960 0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="140" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#C9D1D9">Sushmita Das</text>

  <rect x="225" y="80" width="450" height="88" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="1076" stroke-dashoffset="1076">
    <animate attributeName="stroke-dashoffset" from="1076" to="0" dur="1.2s" fill="freeze"/>
  </rect>
  <g opacity="0">
    <rect x="225" y="60" width="132" height="20" fill="#58A6FF"/>
    <text x="233" y="74" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0D1117">person  0.99</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
  </g>

  <text x="450" y="219" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#8B949E">Computer Engineering @ SIES GST</text>

  <rect x="287" y="198" width="326" height="34" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" from="720" to="0" begin="0.8s" dur="1s" fill="freeze"/>
  </rect>
  <g opacity="0">
    <rect x="287" y="182" width="112" height="16" fill="#58A6FF" fill-opacity="0.8"/>
    <text x="294" y="194" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#0D1117">student  0.97</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/>
  </g>

  <text x="24" y="38" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#484F58">AI/ML  .  CV  .  FULL-STACK</text>
  <text x="876" y="262" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#484F58">conf_threshold = 0.90</text>
</svg>